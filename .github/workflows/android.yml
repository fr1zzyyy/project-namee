
name: Build OderSo Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          unzip -q OderSoLauncherAndroid.zip -d source

          - name: Build APK
            run: |
              PROJECT_DIR=$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
              cd "$PROJECT_DIR"
              gradle assembleDebug

          - name: Upload APK
            uses: actions/upload-artifact@v4
            with:
             name: OderSoLauncher-APK
            path: source/**/build/outputs/apk/debug/*.apk
